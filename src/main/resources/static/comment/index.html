<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✦ 段评 · fqnovel-unidbg</title>
<link rel="stylesheet" href="/css/comment-page.css?v=0.0.3">
</head>
<body>

<button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="切换主题">✦</button>

<div class="page-header">
  <h1>✦ 段评</h1>
  <div class="header-meta" id="metaInfo"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>加载评论中...</div>
</div>
<div id="error" class="error" style="display:none;"></div>
<div id="empty" class="empty" style="display:none;">
  <div class="icon">✦</div>
  <div>此段落暂无评论</div>
</div>
<div id="commentList" class="comment-list" style="display:none;"></div>
<div id="loadMoreWrap" class="load-more-wrap" style="display:none;">
  <button class="load-more" onclick="loadMore()">✦ 加载更多</button>
</div>
<div id="toast" class="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const bookId = params.get('bookId');
const chapterId = params.get('chapterId');
const paraIndex = params.get('paraIndex') || '0';

let cursor = '';
let loading = false;

function metaText() { return '第' + (parseInt(paraIndex)+1) + '段'; }
document.getElementById('metaInfo').textContent = metaText();

async function fetchComments(cursorVal) {
  const body = {
    bookId, chapterId, paraIndex: parseInt(paraIndex),
    count: 20
  };
  if (cursorVal) body.cursor = cursorVal;

  const resp = await fetch('/api/fqcomment/list', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const json = await resp.json();
  if (json.code !== 0) throw new Error(json.message || '获取评论失败');
  return json.data;
}

function renderComments(data, append) {
  const items = data?.data?.comment_list || data?.data?.data_list || data?.comment_list || data?.data?.comments || data?.comments || data?.data?.list || data?.list || [];
  const hasMore = data?.data?.has_more === 1 || data?.data?.has_more === true || data?.has_more === 1;
  const newCursor = data?.data?.cursor || data?.cursor || '';
  cursor = newCursor || '';

  const container = document.getElementById('commentList');

  if (!items || items.length === 0) {
    if (!append) showEmpty();
    return false;
  }

  if (!append) {
    container.innerHTML = '';
    container.style.display = 'block';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('error').style.display = 'none';
  }

  items.forEach(item => {
    const info = item?.comment_info || item;
    const user = info?.user_info || info?.user || {};
    const text = info?.text || info?.content || info?.comment_text || '';
    const createTime = info?.create_time || info?.time || 0;
    const likeCount = info?.like_count || info?.digg_count || 0;
    const replyCount = info?.reply_count || 0;
    const userName = user?.user_name || user?.nickname || '匿名用户';
    const isAuthor = user?.is_author || user?.author || false;

    const avatarLetter = userName.charAt(0).toUpperCase();
    const timeStr = formatTime(createTime);

    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <div class="comment-header">
        <div class="avatar">${avatarLetter}</div>
        <div class="user-info">
          <div class="user-name">
            ${escapeHtml(userName)}
            ${isAuthor ? '<span class="badge author">作者</span>' : ''}
          </div>
          <div class="comment-time">${timeStr}</div>
        </div>
      </div>
      <div class="comment-text">${escapeHtml(text)}</div>
      <div class="comment-footer">
        <span class="stat">✦ <span class="num">${likeCount}</span></span>
        <span class="stat">✦ <span class="num">${replyCount}</span></span>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById('loadMoreWrap').style.display = hasMore && cursor ? 'block' : 'none';
  return true;
}

function showEmpty() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('commentList').style.display = 'none';
  document.getElementById('empty').style.display = 'block';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error');
  el.textContent = msg || '加载失败，请检查网络';
  el.style.display = 'block';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('commentList').style.display = 'none';
}

async function loadMore() {
  if (loading || !cursor) return;
  loading = true;
  try {
    const data = await fetchComments(cursor);
    renderComments(data, true);
  } catch (e) {
    showToast('加载失败');
  } finally {
    loading = false;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function formatTime(ts) {
  if (!ts) return '';
  const d = typeof ts === 'number' && ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Main
(async function() {
  if (!bookId || !chapterId) {
    showError('缺少参数: bookId/chapterId');
    return;
  }
  try {
    const data = await fetchComments('');
    if (!renderComments(data, false)) {
      showEmpty();
    }
  } catch (e) {
    showError(e.message);
  }
  document.getElementById('loading').style.display = 'none';
})();
</script>
</body>
</html>
