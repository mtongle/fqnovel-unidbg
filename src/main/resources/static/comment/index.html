<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>段评</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    background: #f5f5f5; color: #333; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .header {
    position: sticky; top: 0; z-index: 10;
    background: #fff; padding: 14px 16px 12px;
    border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; gap: 10px;
  }
  .header h1 { font-size: 17px; font-weight: 600; color: #1a1a1a; }
  .header .meta { font-size: 13px; color: #999; margin-left: auto; }

  .loading, .empty, .error {
    text-align: center; padding: 60px 20px; color: #999; font-size: 15px;
  }
  .loading .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #e0e0e0; border-top-color: #4A90D9;
    border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #e74c3c; }
  .empty .icon { font-size: 40px; margin-bottom: 8px; }

  .comment-list { padding: 0 16px; }
  .comment-item {
    background: #fff; border-radius: 10px; padding: 14px 16px; margin: 10px 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .comment-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #e8f0fe; color: #4A90D9;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; flex-shrink: 0;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: 14px; font-weight: 500; color: #333; }
  .user-name .badge {
    display: inline-block; font-size: 10px; padding: 1px 5px;
    border-radius: 3px; margin-left: 4px; vertical-align: middle;
  }
  .badge.author { background: #fff3e0; color: #e67e22; }
  .badge.vip { background: #fce4ec; color: #e74c3c; }
  .comment-time { font-size: 12px; color: #bbb; }
  .comment-text { font-size: 15px; color: #2c2c2c; line-height: 1.7; word-break: break-word; }
  .comment-text .reply-to {
    color: #4A90D9; font-weight: 500;
  }
  .comment-footer {
    display: flex; align-items: center; gap: 16px; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid #f0f0f0;
  }
  .comment-footer .stat {
    font-size: 12px; color: #bbb; display: flex; align-items: center; gap: 3px;
  }
  .comment-footer .stat .num { color: #999; }

  .load-more-wrap { text-align: center; padding: 16px 0 32px; }
  .load-more {
    background: #fff; border: 1px solid #ddd; border-radius: 20px;
    padding: 8px 24px; font-size: 14px; color: #666; cursor: pointer;
    transition: all .2s;
  }
  .load-more:active { background: #f5f5f5; }

  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.75); color: #fff; padding: 8px 20px;
    border-radius: 20px; font-size: 14px; z-index: 100;
    opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #e5e5e5; }
    .header { background: #2c2c2e; border-bottom-color: #3a3a3c; }
    .header h1 { color: #f0f0f0; }
    .comment-item { background: #2c2c2e; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .comment-text { color: #e0e0e0; }
    .comment-footer { border-top-color: #3a3a3c; }
    .user-name { color: #e0e0e0; }
    .load-more { background: #2c2c2e; border-color: #3a3a3c; color: #aaa; }
    .load-more:active { background: #3a3a3c; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>💬 段评</h1>
  <div class="meta" id="metaInfo"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>加载评论中...</div>
</div>
<div id="error" class="error" style="display:none;"></div>
<div id="empty" class="empty" style="display:none;">
  <div class="icon">📭</div>
  <div>此段落暂无评论</div>
</div>
<div id="commentList" class="comment-list" style="display:none;"></div>
<div id="loadMoreWrap" class="load-more-wrap" style="display:none;">
  <button class="load-more" onclick="loadMore()">加载更多</button>
</div>
<div id="toast" class="toast"></div>

<script>
const params = new URLSearchParams(location.search);
const bookId = params.get('bookId');
const chapterId = params.get('chapterId');
const paraIndex = params.get('paraIndex') || '0';

let cursor = '';
let loading = false;

function metaText() { return `第${parseInt(paraIndex)+1}段`; }
document.getElementById('metaInfo').textContent = metaText();

async function fetchComments(cursorVal) {
  const body = {
    bookId, chapterId, paraIndex: parseInt(paraIndex),
    count: 20
  };
  if (cursorVal) body.cursor = cursorVal;

  const resp = await fetch('/api/fqcomment/list', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const json = await resp.json();
  if (json.code !== 0) throw new Error(json.message || '获取评论失败');
  return json.data;
}

function renderComments(data, append) {
  // Try various paths to find comment list
  const items = data?.data?.comment_list || data?.data?.data_list || data?.comment_list || data?.data?.comments || data?.comments || data?.data?.list || data?.list || [];
  const hasMore = data?.data?.has_more === 1 || data?.data?.has_more === true || data?.has_more === 1;
  const newCursor = data?.data?.cursor || data?.cursor || '';
  cursor = newCursor || '';

  const container = document.getElementById('commentList');

  if (!items || items.length === 0) {
    if (!append) showEmpty();
    return false;
  }

  if (!append) {
    container.innerHTML = '';
    container.style.display = 'block';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('error').style.display = 'none';
  }

  items.forEach(item => {
    const info = item?.comment_info || item;
    const user = info?.user_info || info?.user || {};
    const text = info?.text || info?.content || info?.comment_text || '';
    const createTime = info?.create_time || info?.time || 0;
    const likeCount = info?.like_count || info?.digg_count || 0;
    const replyCount = info?.reply_count || 0;
    const userName = user?.user_name || user?.nickname || '匿名用户';
    const isAuthor = user?.is_author || user?.author || false;

    const avatarLetter = userName.charAt(0).toUpperCase();
    const timeStr = formatTime(createTime);

    const div = document.createElement('div');
    div.className = 'comment-item';
    div.innerHTML = `
      <div class="comment-header">
        <div class="avatar">${avatarLetter}</div>
        <div class="user-info">
          <div class="user-name">
            ${escapeHtml(userName)}
            ${isAuthor ? '<span class="badge author">作者</span>' : ''}
          </div>
          <div class="comment-time">${timeStr}</div>
        </div>
      </div>
      <div class="comment-text">${escapeHtml(text)}</div>
      <div class="comment-footer">
        <span class="stat">👍 <span class="num">${likeCount}</span></span>
        <span class="stat">💬 <span class="num">${replyCount}</span></span>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById('loadMoreWrap').style.display = hasMore && cursor ? 'block' : 'none';
  return true;
}

function showEmpty() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display = 'none';
  document.getElementById('commentList').style.display = 'none';
  document.getElementById('empty').style.display = 'block';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('error');
  el.textContent = msg || '加载失败，请检查网络';
  el.style.display = 'block';
  document.getElementById('empty').style.display = 'none';
  document.getElementById('commentList').style.display = 'none';
}

async function loadMore() {
  if (loading || !cursor) return;
  loading = true;
  try {
    const data = await fetchComments(cursor);
    renderComments(data, true);
  } catch (e) {
    showToast('加载失败');
  } finally {
    loading = false;
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function formatTime(ts) {
  if (!ts) return '';
  const d = typeof ts === 'number' && ts > 1e12 ? new Date(ts) : new Date(ts * 1000);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000) + '小时前';
  return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Main
(async function() {
  if (!bookId || !chapterId) {
    showError('缺少参数: bookId/chapterId');
    return;
  }
  try {
    const data = await fetchComments('');
    if (!renderComments(data, false)) {
      showEmpty();
    }
  } catch (e) {
    showError(e.message);
  }
  document.getElementById('loading').style.display = 'none';
})();
</script>
</body>
</html>
