<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 章节阅读</title>
<link rel="stylesheet" href="/css/public.css?v=0.0.6">
<link rel="stylesheet" href="/admin/css/admin.css?v=0.0.6">
<style>
.chapter-content {
  font-size: 0.92rem;
  line-height: 1.9;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-wrap: break-word;
  max-height: 70vh;
  overflow-y: auto;
  padding: 4px 0;
}
.detail-empty {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}
</style>
</head>
<body>

<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="theme-toggle-admin" id="adminThemeToggle" onclick="toggleAdminTheme()" title="切换主题">✦</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="sidebar-subtitle">管理面板</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item" data-section="dashboard"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/admin/config.html" class="nav-item" data-section="config"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-settings"/></svg></span>配置编辑器</a>
    <a href="/admin/devices.html" class="nav-item" data-section="device-pool"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-device"/></svg></span>设备池管理</a>
    <a href="/admin/system.html" class="nav-item" data-section="system"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-monitor"/></svg></span>系统监控</a>
    <a href="/admin/search.html" class="nav-item" data-section="book-search"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/admin/download.html" class="nav-item" data-section="download"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/admin/books.html" class="nav-item" data-section="books"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/admin/reader.html" class="nav-item" data-section="chapter-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/admin/comments.html" class="nav-item" data-section="comment-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm btn-outline" onclick="lockPanel()" title="锁定面板">✦ 锁定</button>
  </div>
</aside>

<main class="content">
  <section class="section active" style="display:block;">
    <div class="section-header"><h2>✦ 章节阅读</h2></div>
    <div class="card mb-12">
      <div class="card-body">
        <div class="search-bar">
          <input type="text" id="cv-book-id" class="search-input" style="max-width:180px;" placeholder="Book ID" autocomplete="off">
          <input type="text" id="cv-chapter-id" class="search-input" style="max-width:180px;" placeholder="Chapter ID" autocomplete="off">
          <button class="btn btn-primary" id="btn-cv-load">✦ 加载</button>
          <button class="btn btn-sm" id="btn-cv-prev" disabled>← 上一章</button>
          <button class="btn btn-sm" id="btn-cv-next" disabled>下一章 →</button>
          <a href="/admin/comments.html" class="btn btn-sm btn-accent" id="btn-cv-comments"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg> 段评</a>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header" id="cv-title">✦ 章节标题</div>
      <div class="card-body">
        <div class="chapter-content" id="cv-content"><div class="detail-empty">✦ 输入 Book ID 和 Chapter ID 加载章节</div></div>
      </div>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=0.0.6"></script>
<script src="/admin/js/admin-common.js?v=0.0.6"></script>
<script>
(function(){
  var _state = { bookId: null, chapterId: null, prevId: null, nextId: null };

  async function loadChapter() {
    var bookId = $('cv-book-id').value.trim();
    var chapterId = $('cv-chapter-id').value.trim();
    if (!bookId || !chapterId) { showToast('请输入 Book ID 和 Chapter ID', 'error'); return; }
    $('btn-cv-prev').disabled = true;
    $('btn-cv-next').disabled = true;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqnovel/chapter/' + encodeURIComponent(bookId) + '/' + encodeURIComponent(chapterId));
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'获取章节失败', 'error'); $('cv-content').innerHTML = '<div class="detail-empty">获取章节失败</div>'; return; }
      var data = resp.data;
      if (!data) return;
      _state.bookId = data.bookId;
      _state.chapterId = data.chapterId;
      _state.prevId = data.prevChapterId;
      _state.nextId = data.nextChapterId;
      $('cv-title').textContent = data.title || ('章节 ' + data.chapterId);
      $('cv-content').innerHTML = (data.txtContent || data.rawContent || '内容为空').replace(/\n/g, '<br>');
      $('btn-cv-prev').disabled = !data.prevChapterId;
      $('btn-cv-next').disabled = !data.nextChapterId;
      var cmLink = $('btn-cv-comments');
      if (cmLink) { var p = new URLSearchParams(); p.set('bookId', data.bookId||''); p.set('chapterId', data.chapterId||''); cmLink.href = '/admin/comments.html?' + p.toString(); }
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); $('cv-content').innerHTML = '<div class="detail-empty">加载出错: ' + escapeHtml(e.message) + '</div>'; }
    finally { hideLoading(); }
  }

  function prevChapter() { if (_state.prevId) { $('cv-chapter-id').value = _state.prevId; loadChapter(); } }
  function nextChapter() { if (_state.nextId) { $('cv-chapter-id').value = _state.nextId; loadChapter(); } }

  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(location.search);
    if (params.get('bookId')) $('cv-book-id').value = params.get('bookId');
    if (params.get('chapterId')) { $('cv-chapter-id').value = params.get('chapterId'); loadChapter(); }
    $('btn-cv-load').addEventListener('click', loadChapter);
    $('btn-cv-prev').addEventListener('click', prevChapter);
    $('btn-cv-next').addEventListener('click', nextChapter);
    $('cv-chapter-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadChapter(); });
    $('cv-book-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadChapter(); });
  });
})();
</script>
</body>
</html>
