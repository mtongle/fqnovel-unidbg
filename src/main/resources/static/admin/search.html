<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 书籍搜索</title>
<link rel="stylesheet" href="/css/public.css?v=2.0.0">
<link rel="stylesheet" href="/admin/css/admin.css?v=2.0.0">
</head>
<body>

<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="theme-toggle-admin" id="adminThemeToggle" onclick="toggleAdminTheme()" title="切换主题">✦</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="sidebar-subtitle">管理面板</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item" data-section="dashboard"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/admin/config.html" class="nav-item" data-section="config"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-settings"/></svg></span>配置编辑器</a>
    <a href="/admin/devices.html" class="nav-item" data-section="device-pool"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-device"/></svg></span>设备池管理</a>
    <a href="/admin/system.html" class="nav-item" data-section="system"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-monitor"/></svg></span>系统监控</a>
    <a href="/admin/search.html" class="nav-item" data-section="book-search"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/admin/download.html" class="nav-item" data-section="download"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/admin/books.html" class="nav-item" data-section="books"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/admin/reader.html" class="nav-item" data-section="chapter-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/admin/comments.html" class="nav-item" data-section="comment-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm btn-outline" onclick="lockPanel()" title="锁定面板">✦ 锁定</button>
    <a href="/dashboard.html" class="btn btn-sm btn-outline">← 返回公开面板</a>
  </div>
</aside>

<main class="content">
  <section class="section active" style="display:block;">
    <div class="section-header">
      <div class="section-header-main">
        <h2>✦ 书籍搜索</h2>
        <p class="section-header-desc">按书名 / 作者关键词搜索番茄小说全量书目(Ctrl+K 快速聚焦)</p>
      </div>
    </div>
    <div class="card mb-12">
      <div class="card-body">
        <div class="search-bar">
          <select id="bs-tab-type" class="search-select">
            <option value="1">综合</option><option value="3">书籍</option><option value="5">全文</option>
          </select>
          <input type="text" id="bs-query" class="search-input" placeholder="输入书名/作者关键词" autocomplete="off">
          <button class="btn btn-primary" id="btn-bs-search">✦ 搜索</button>
          <button class="btn btn-outline" id="btn-bs-clear">✦ 清空</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">搜索结果 <span id="bs-result-count" class="text-muted"></span></div>
      <div class="card-body">
        <div class="table-wrapper">
          <table class="data-table" id="bs-result-table">
            <thead><tr><th>书名</th><th>作者</th><th>状态</th><th>字数</th><th>评分</th><th>分类</th><th>操作</th></tr></thead>
            <tbody id="bs-result-body"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 输入关键词开始搜索</td></tr></tbody>
          </table>
        </div>
        <div class="pagination" id="bs-pagination"></div>
      </div>
    </div>
    <div id="bs-detail-container"></div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=2.0.0"></script>
<script src="/admin/js/admin-common.js?v=2.0.0"></script>
<script>
(function(){
  var _state = { offset: 0, query: '', tabType: 1 };
  var _detailBookId = null;

  async function searchBooks(offset) {
    var query = $('bs-query').value.trim();
    if (!query) { showToast('请输入搜索关键词', 'error'); return; }
    if (offset == null) offset = 0;
    _state.query = query;
    _state.tabType = parseInt($('bs-tab-type').value, 10);
    _state.offset = offset;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqsearch/books?query=' + encodeURIComponent(query)
        + '&tabType=' + _state.tabType + '&offset=' + offset + '&count=20');
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'搜索失败', 'error'); return; }
      renderResults(resp.data);
    } catch(e) { showToast('搜索请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  function renderResults(data) {
    var books = (data && data.books) || [];
    var total = data && data.total;
    var body = $('bs-result-body');
    var count = $('bs-result-count');
    if (count) count.textContent = total != null ? '（共 ' + total + ' 条）' : '';
    if (!books.length) {
      body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">未找到结果</td></tr>';
      renderPagination($('bs-pagination'), 0, 1);
      return;
    }
    body.innerHTML = books.map(function(b){
      var coverSrc = normalizeImageUrl(b.coverUrl||'');
      var img = coverSrc ? '<img src="'+escapeHtml(coverSrc)+'" onerror="fixHeicImg(this)" style="width:32px;height:44px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:6px;">' : '';
      return '<tr><td>'+img+'<span>'+escapeHtml(b.bookName||'--')+'</span></td><td>'+escapeHtml(b.author||'--')+'</td><td>'+bookStatusText(b.status)+'</td><td>'+formatWordCount(b.wordCount)+'</td><td>'+(b.rating!=null?b.rating:'--')+'</td><td>'+escapeHtml(b.category||'--')+'</td><td><button class="btn btn-sm btn-primary bs-view-detail" data-book-id="'+escapeHtml(b.bookId)+'">详情</button></td></tr>';
    }).join('');
    body.querySelectorAll('.bs-view-detail').forEach(function(btn){
      btn.addEventListener('click', function(){ showBookDetail(this.dataset.bookId); });
    });
    renderPagination($('bs-pagination'), _state.offset, total!=null ? Math.ceil(total/20) : 1, function(pageOffset){ searchBooks(pageOffset); });
  }

  function renderPagination(container, currentOffset, totalPages, onPageClick) {
    if (!container) return;
    if (totalPages <= 1 && currentOffset === 0) { container.innerHTML = ''; return; }
    var cur = Math.floor(currentOffset / 20) + 1;
    var h = '';
    if (cur > 1) h += '<button class="page-btn" data-offset="' + (currentOffset - 20) + '">上一页</button>';
    var start = Math.max(1, cur - 2);
    var end = Math.min(totalPages, cur + 2);
    for (var i = start; i <= end; i++) { var off = (i - 1) * 20; h += '<button class="page-btn' + (i === cur ? ' active' : '') + '" data-offset="' + off + '">' + i + '</button>'; }
    if (cur < totalPages) h += '<button class="page-btn" data-offset="' + (currentOffset + 20) + '">下一页</button>';
    h += '<span class="page-info">' + cur + '/' + totalPages + '</span>';
    container.innerHTML = h;
    if (onPageClick) { container.querySelectorAll('.page-btn').forEach(function(btn){ btn.addEventListener('click', function(){ if (!this.disabled) onPageClick(parseInt(this.dataset.offset, 10)); }); }); }
  }

  async function showBookDetail(bookId) {
    if (!bookId) return;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqnovel/book/' + encodeURIComponent(bookId));
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'获取详情失败', 'error'); return; }
      var container = $('bs-detail-container');
      if (!container) return;
      container.innerHTML = '';
      var d = resp.data;
      _detailBookId = d.bookId || _detailBookId;
      var coverUrl = normalizeImageUrl(d.coverUrl);
      var coverHtml = coverUrl ? '<img class="book-detail-cover" src="'+escapeHtml(coverUrl)+'" alt="cover" onerror="fixHeicImg(this)">' : '<div style="width:140px;height:200px;background:var(--bg-tertiary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:2rem;"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></div>';
      var fch = d.firstChapterItemId || '';
      var bid = _detailBookId;
      var vipHtml = '';
      if (d.vipBook === true || d.vipBook === '1' || d.vipBook === 'true') { vipHtml = '<div style="padding:6px 0;display:flex;justify-content:space-between;font-size:0.85rem;border-bottom:1px solid rgba(255,255,255,0.04);"><span style="color:var(--text-secondary);">付费</span><span style="color:var(--text-primary);font-weight:500;">是</span></div>'; }
      var card = document.createElement('div');
      card.className = 'card';
      card.style.marginTop = '12px';
      card.innerHTML = '<div class="card-header"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg> 书籍详情 <span style="float:right;cursor:pointer;color:var(--text-muted);" class="bs-close-card">✕</span></div><div class="card-body"><div class="book-detail">'+coverHtml+'<div class="book-detail-info"><h3>'+escapeHtml(d.bookName||'--')+'</h3><div class="author">'+escapeHtml(d.author||'--')+'</div><div class="desc">'+escapeHtml((d.description||'').slice(0,500))+'</div><div class="book-detail-stats"><div class="stat"><span class="stat-label">状态</span><span class="stat-value">'+bookStatusText(d.status)+'</span></div><div class="stat"><span class="stat-label">字数</span><span class="stat-value">'+formatWordCount(d.wordNumber)+'</span></div><div class="stat"><span class="stat-label">章节</span><span class="stat-value">'+(d.totalChapters!=null?d.totalChapters:'--')+'</span></div><div class="stat"><span class="stat-label">评分</span><span class="stat-value">'+(d.score!=null?d.score:'--')+'</span></div><div class="stat"><span class="stat-label">分类</span><span class="stat-value">'+escapeHtml(d.category||'--')+'</span></div><div class="stat"><span class="stat-label">阅读</span><span class="stat-value">'+escapeHtml(d.readCount||'--')+'</span></div>'+vipHtml+'</div><div class="flex gap-8" style="flex-wrap:wrap;"><button class="btn btn-primary btn-sm bs-show-dir" data-book-id="'+escapeHtml(bid)+'"><svg class="ic"><use href="/css/icons.svg#icon-clipboard"/></svg> 查看目录</button><button class="btn btn-sm bs-read-book" data-book-id="'+escapeHtml(bid)+'" data-first-chapter="'+escapeHtml(fch)+'"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg> 开始阅读</button><button class="btn btn-sm btn-outline bs-close-card">收起</button></div></div></div></div>';
      container.appendChild(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.querySelectorAll('.bs-close-card').forEach(function(btn){ btn.addEventListener('click', function(){ container.innerHTML = ''; }); });
      var dirBtn = card.querySelector('.bs-show-dir');
      if (dirBtn) dirBtn.addEventListener('click', function(){ showBookDirectory(this.dataset.bookId); });
      var readBtn = card.querySelector('.bs-read-book');
      if (readBtn) readBtn.addEventListener('click', function(){
        var bid2 = this.dataset.bookId, cid = this.dataset.firstChapter;
        if (bid2 && cid) { window.open('/admin/reader.html?bookId='+encodeURIComponent(bid2)+'&chapterId='+encodeURIComponent(cid)); }
        else showToast('缺少章节信息', 'error');
      });
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  async function showBookDirectory(bookId) {
    if (!bookId) return;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqsearch/directory/' + encodeURIComponent(bookId));
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'获取目录失败', 'error'); return; }
      var container = $('bs-detail-container');
      if (!container) return;
      var items = (resp.data && (resp.data.itemDataList || resp.data.item_data_list)) || [];
      var card = document.createElement('div');
      card.className = 'card';
      card.style.marginTop = '12px';
      var tableBody = !items.length
        ? '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--text-muted);">暂无目录数据</td></tr>'
        : items.map(function(item, idx){
            var ci = item.chapter_index || item.chapterIndex || idx + 1;
            var iid = item.item_id || item.itemId;
            var cwn = item.chapter_word_number || item.chapterWordNumber;
            var ct = item.chapter_type || item.chapterType;
            var isf = item.is_free != null ? item.is_free : item.isFree;
            return '<tr><td>'+ci+'</td><td>'+escapeHtml(item.title||'--')+'</td><td>'+formatWordCount(cwn)+'</td><td>'+(ct==='1'?'番外':'正文')+'</td><td>'+(isf ? '<span class="badge badge-green">免费</span>' : '<span class="badge badge-orange">付费</span>')+'</td><td><a href="/admin/reader.html?bookId='+encodeURIComponent(bookId)+'&chapterId='+encodeURIComponent(iid)+'" class="btn btn-sm">阅读</a></td></tr>';
          }).join('');
      card.innerHTML = '<div class="card-header"><svg class="ic"><use href="/css/icons.svg#icon-clipboard"/></svg> 章节目录</div><div class="card-body"><div class="table-wrapper"><table class="data-table"><thead><tr><th>序号</th><th>章节名</th><th>字数</th><th>类型</th><th>免费/付费</th><th>操作</th></tr></thead><tbody>'+tableBody+'</tbody></table></div></div>';
      container.appendChild(card);
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    $('btn-bs-search').addEventListener('click', function(){ searchBooks(0); });
    $('bs-query').addEventListener('keydown', function(e){ if (e.key === 'Enter') searchBooks(0); });

    // T9 表单直觉化:清空按钮恢复初始态
    var clearBtn = $('btn-bs-clear');
    if (clearBtn) clearBtn.addEventListener('click', function(){
      $('bs-query').value = '';
      var body = $('bs-result-body');
      if (body) body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 输入关键词开始搜索</td></tr>';
      var count = $('bs-result-count');
      if (count) count.textContent = '';
      var pg = $('bs-pagination');
      if (pg) pg.innerHTML = '';
      var dc = $('bs-detail-container');
      if (dc) dc.innerHTML = '';
      $('bs-query').focus();
    });

    // T9 快捷键:Ctrl+K 聚焦搜索框
    registerShortcut('ctrl+k', function(e){ e.preventDefault(); var q = $('bs-query'); if (q) { q.focus(); q.select(); } });
  });
})();
</script>
</body>
</html>
