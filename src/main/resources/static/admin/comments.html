<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 段评查询</title>
<link rel="stylesheet" href="/css/public.css?v=0.0.6">
<link rel="stylesheet" href="/admin/css/admin.css?v=0.0.6">
</head>
<body>

<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="theme-toggle-admin" id="adminThemeToggle" onclick="toggleAdminTheme()" title="切换主题">✦</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="sidebar-subtitle">管理面板</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item" data-section="dashboard"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/admin/config.html" class="nav-item" data-section="config"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-settings"/></svg></span>配置编辑器</a>
    <a href="/admin/devices.html" class="nav-item" data-section="device-pool"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-device"/></svg></span>设备池管理</a>
    <a href="/admin/system.html" class="nav-item" data-section="system"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-monitor"/></svg></span>系统监控</a>
    <a href="/admin/search.html" class="nav-item" data-section="book-search"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/admin/download.html" class="nav-item" data-section="download"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/admin/books.html" class="nav-item" data-section="books"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/admin/reader.html" class="nav-item" data-section="chapter-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/admin/comments.html" class="nav-item" data-section="comment-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm btn-outline" onclick="lockPanel()" title="锁定面板">✦ 锁定</button>
  </div>
</aside>

<main class="content">
  <section class="section active" style="display:block;">
    <div class="section-header"><h2>✦ 段评查询</h2></div>
    <div class="card mb-12">
      <div class="card-body">
        <div class="search-bar flex-wrap">
          <input type="text" id="cm-book-id" class="search-input" style="max-width:180px;" placeholder="Book ID" autocomplete="off">
          <input type="text" id="cm-chapter-id" class="search-input" style="max-width:180px;" placeholder="Chapter ID" autocomplete="off">
          <input type="number" id="cm-para-idx" class="search-input" style="max-width:100px;" placeholder="段落索引" value="0">
          <button class="btn btn-primary" id="btn-cm-idea">✦ 统计</button>
          <button class="btn btn-accent" id="btn-cm-list">✦ 查询</button>
        </div>
      </div>
    </div>
    <div class="card mb-12">
      <div class="card-header">段评列表 <span id="cm-list-count" class="text-muted"></span></div>
      <div class="card-body" id="cm-list-result"><div class="detail-empty">✦ 暂无数据</div></div>
    </div>
    <div class="card">
      <div class="card-header">段落评论统计</div>
      <div class="card-body" id="cm-idea-result"><div class="detail-empty">✦ 暂无数据</div></div>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=0.0.6"></script>
<script src="/admin/js/admin-common.js?v=0.0.6"></script>
<script>
(function(){
  function jsonToVisual(obj, depth) {
    if (depth == null) depth = 0;
    if (depth > 4) return '<div style="color:var(--text-muted);padding:4px 0;">(深度过大，已截断)</div>';
    if (obj === null || obj === undefined) return '<span style="color:var(--text-muted);">null</span>';
    if (typeof obj === 'boolean') return '<span style="color:#e74c3c;font-weight:500;">' + obj + '</span>';
    if (typeof obj === 'number') return '<span style="color:#2ecc71;font-weight:500;">' + obj + '</span>';
    if (typeof obj === 'string') { if (obj.length > 200) obj = obj.slice(0, 200) + '…'; return '<span style="color:#e0e0f0;">' + escapeHtml(obj) + '</span>'; }
    if (Array.isArray(obj)) {
      if (obj.length === 0) return '<span style="color:var(--text-muted);">[]</span>';
      return obj.map(function(item, i){ return '<div style="padding:4px 0 4px '+((depth+1)*16)+'px;border-bottom:1px solid rgba(255,255,255,0.04);"><span style="color:var(--text-muted);font-size:0.75rem;margin-right:6px;">#'+i+'</span>'+jsonToVisual(item, depth+1)+'</div>'; }).join('');
    }
    if (typeof obj === 'object') {
      var keys = Object.keys(obj);
      if (keys.length === 0) return '<span style="color:var(--text-muted);">{}</span>';
      return keys.map(function(k){ return '<div style="display:flex;padding:5px 0 5px '+(depth*16)+'px;border-bottom:1px solid rgba(255,255,255,0.04);gap:8px;"><span style="color:var(--accent-blue);font-size:0.82rem;font-weight:500;min-width:120px;flex-shrink:0;font-family:monospace;">'+escapeHtml(k)+'</span><span style="flex:1;">'+jsonToVisual(obj[k], depth+1)+'</span></div>'; }).join('');
    }
    return escapeHtml(String(obj));
  }

  function renderIdeaStats(raw) {
    if (!raw || typeof raw !== 'object') return '<div class="detail-empty">无数据</div>';
    var stats = raw.data || raw;
    if (typeof stats !== 'object') return '<div class="detail-empty">无数据</div>';
    if (stats.data && typeof stats.data === 'object' && !Array.isArray(stats.data)) { var nk = Object.keys(stats.data).filter(function(k){ return /^\d+$/.test(k); }); if (nk.length > 0) stats = stats.data; }
    var keys = Object.keys(stats).filter(function(k){ return /^\d+$/.test(k); });
    if (keys.length === 0) return '<div class="detail-empty">无数据</div>';
    var total = 0;
    var rows = keys.map(function(k){
      var info = stats[k];
      if (!info || typeof info !== 'object') return '';
      var count = info.count || info.comment_count || 0;
      total += count;
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--border-color);font-size:0.85rem;"><span style="color:var(--text-secondary);">段落 ' + k + '</span><span><span style="font-weight:600;color:var(--text-primary);font-family:monospace;">' + count + '</span> 条评论</span></div>';
    }).filter(Boolean).join('');
    return '<div style="margin-bottom:8px;padding:8px 10px;background:var(--bg-tertiary);border-radius:var(--radius-sm);display:flex;gap:20px;font-size:0.85rem;"><span><svg class="ic"><use href="/css/icons.svg#icon-stats"/></svg> 共 <strong>' + total + '</strong> 条段评</span><span><svg class="ic"><use href="/css/icons.svg#icon-file-text"/></svg> <strong>' + keys.length + '</strong> 个段落</span></div><div>' + rows + '</div>';
  }

  function findCommentArray(data) {
    if (!data || typeof data !== 'object') return null;
    var inner = data.data || data.result || data.response || data;
    var candidates = ['data_list', 'comments', 'list', 'comment_list', 'items', 'replies', 'records'];
    for (var i = 0; i < candidates.length; i++) { if (Array.isArray(inner[candidates[i]]) && inner[candidates[i]].length > 0) return inner[candidates[i]]; }
    if (inner.data && Array.isArray(inner.data)) return inner.data;
    var keys = Object.keys(inner);
    for (var i = 0; i < keys.length; i++) { if (Array.isArray(inner[keys[i]])) return inner[keys[i]]; }
    return null;
  }

  function extractComment(c) {
    var item = c.comment || c;
    var common = item.common || item;
    var content = common.content || {};
    var userInfo = common.user_info || {};
    var baseInfo = userInfo.base_info || userInfo;
    var expand = item.expand || {};
    return {
      id: common.comment_id || item.comment_id || '',
      userId: baseInfo.user_id || '',
      userName: baseInfo.user_name || baseInfo.nickname || baseInfo.name || item.user_name || '匿名',
      avatarUrl: normalizeImageUrl(baseInfo.user_avatar || baseInfo.avatar_url || baseInfo.avatar || item.user_avatar || ''),
      description: baseInfo.description || userInfo.description || '',
      content: content.text || content.content || common.content_text || item.content || '(无内容)',
      quoteText: expand.para_src_content || '',
      time: common.create_timestamp || common.create_time || item.create_time || 0,
      likeCount: common.digg_count || common.like_count || item.digg_count || 0,
      replyCount: common.reply_count || item.reply_count || 0,
      isAuthor: baseInfo.is_author || userInfo.is_author || false,
      isVip: baseInfo.is_vip || userInfo.is_vip || false,
      gender: baseInfo.gender || baseInfo.profile_gender || 0
    };
  }

  function renderCommentCards(rawComments) {
    if (!rawComments || !rawComments.length) return '<div class="detail-empty">暂无评论</div>';
    return rawComments.map(function(c){
      var e = extractComment(c);
      var avatarHtml = e.avatarUrl
        ? '<img src="'+escapeHtml(e.avatarUrl)+'" onerror="fixHeicImg(this)" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;">'
        : '<div style="width:42px;height:42px;border-radius:50%;background:var(--accent-blue-bg);color:var(--accent-blue);display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:600;flex-shrink:0;">'+escapeHtml((e.userName.charAt(0)||'?').toUpperCase())+'</div>';
      var genderIcon = e.gender === 1 ? '♂️' : e.gender === 2 ? '♀️' : '';
      var badges = [];
      if (e.isAuthor) badges.push('<span style="font-size:0.65rem;background:var(--accent-orange-bg);color:var(--accent-orange);padding:1px 6px;border-radius:8px;font-weight:600;">作者</span>');
      if (e.isVip) badges.push('<span style="font-size:0.65rem;background:var(--accent-blue-bg);color:var(--accent-blue);padding:1px 6px;border-radius:8px;font-weight:600;">VIP</span>');
      var quoteHtml = e.quoteText ? '<div style="margin:6px 0;padding:8px 10px;background:var(--bg-tertiary);border-left:3px solid var(--accent-blue);border-radius:4px;font-size:0.78rem;color:var(--text-muted);line-height:1.5;">"'+escapeHtml(e.quoteText.slice(0,300))+'"</div>' : '';
      var descHtml = e.description ? '<div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:6px;">'+escapeHtml(e.description.slice(0,60))+'</div>' : '';
      var idHtml = e.id ? '<span style="font-size:0.65rem;color:var(--text-muted);font-family:monospace;">#'+escapeHtml(e.id)+'</span>' : '';
      return '<div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border-color);">'+avatarHtml+'<div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px;"><span style="font-size:0.9rem;font-weight:600;color:var(--accent-blue);">'+escapeHtml(e.userName)+'</span>'+genderIcon+badges.join('')+'<span style="font-size:0.72rem;color:var(--text-muted);margin-left:auto;">'+formatCommentTime(e.time)+'</span></div>'+descHtml+quoteHtml+'<div style="font-size:0.85rem;line-height:1.7;color:var(--text-primary);word-wrap:break-word;">'+escapeHtml(e.content)+'</div><div style="display:flex;align-items:center;gap:20px;margin-top:8px;">'+(e.likeCount>0?'<span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:3px;"><svg class="ic"><use href="/css/icons.svg#icon-thumbs-up"/></svg> '+e.likeCount+'</span>':'')+(e.replyCount>0?'<span style="font-size:0.78rem;color:var(--text-muted);display:flex;align-items:center;gap:3px;"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg> '+e.replyCount+'</span>':'')+idHtml+'</div></div></div>';
    }).join('');
  }

  async function queryIdea() {
    var chapterId = $('cm-chapter-id').value.trim();
    if (!chapterId) { showToast('请输入 Chapter ID', 'error'); return; }
    showLoading();
    try {
      var resp = await apiPostDirect('/api/fqcomment/idea', { chapterId: chapterId, bookId: $('cm-book-id').value.trim() || null });
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'查询统计失败', 'error'); return; }
      $('cm-idea-result').innerHTML = resp.data ? renderIdeaStats(resp.data) : '<div class="detail-empty">无数据</div>';
      showToast('段评统计查询成功', 'success');
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  async function queryList() {
    var chapterId = $('cm-chapter-id').value.trim();
    var bookId = $('cm-book-id').value.trim();
    var paraIdx = parseInt($('cm-para-idx').value, 10) || 0;
    if (!chapterId || !bookId) { showToast('请输入 Book ID 和 Chapter ID', 'error'); return; }
    showLoading();
    try {
      var resp = await apiPostDirect('/api/fqcomment/list', { chapterId: chapterId, bookId: bookId, paraIndex: paraIdx, count: 20 });
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'查询段评失败', 'error'); return; }
      var raw = resp.data;
      if (raw) {
        var comments = findCommentArray(raw);
        var totalCount = raw.data && raw.data.common_list_info && raw.data.common_list_info.total;
        if ($('cm-list-count')) $('cm-list-count').textContent = totalCount ? '（共 '+totalCount+' 条）' : (comments ? '（'+comments.length+' 条）' : '');
        if (comments) { $('cm-list-result').innerHTML = renderCommentCards(comments); }
        else { $('cm-list-result').innerHTML = jsonToVisual(raw); }
      } else { $('cm-list-count').textContent = ''; $('cm-list-result').innerHTML = '<div class="detail-empty">无数据</div>'; }
      showToast('段评详情查询成功', 'success');
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(location.search);
    if (params.get('bookId')) $('cm-book-id').value = params.get('bookId');
    if (params.get('chapterId')) $('cm-chapter-id').value = params.get('chapterId');
    $('btn-cm-idea').addEventListener('click', queryIdea);
    $('btn-cm-list').addEventListener('click', queryList);
    $('cm-chapter-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') queryIdea(); });
  });
})();
</script>
</body>
</html>
