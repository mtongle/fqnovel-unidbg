<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg - 管理面板登录</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<style>
  .login-body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-primary);
    padding: 20px;
  }
  .login-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    animation: fadeIn 0.4s ease;
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 8px;
    font-size: 2rem;
  }
  .login-card h1 {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .login-card .subtitle {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 28px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  .login-card .version {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .login-form .field {
    margin-bottom: 16px;
  }
  .login-form label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .login-form input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .login-form input[type="password"]:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 2px var(--accent-blue-bg);
  }
  .login-form input[type="password"]::placeholder {
    color: var(--text-muted);
  }
  .login-form .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--accent-blue);
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition);
    margin-top: 8px;
  }
  .login-form .btn-login:hover { background: #3d6ee6; }
  .login-form .btn-login:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .login-error {
    display: none;
    padding: 10px 12px;
    background: var(--accent-red-bg);
    border: 1px solid rgba(231,76,60,0.3);
    border-radius: var(--radius-sm);
    color: var(--accent-red);
    font-size: 0.85rem;
    margin-bottom: 16px;
    text-align: center;
  }
  .login-error.visible { display: block; }
  .login-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
</style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="logo">⚡</div>
    <h1>fqnovel-unidbg</h1>
    <div class="subtitle">管理面板</div>

    <div class="login-error" id="login-error">密码错误，请重试</div>

    <form class="login-form" id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">管理员密码</label>
        <input type="password" id="password" placeholder="请输入管理面板密码" autofocus>
      </div>
      <button type="submit" class="btn-login" id="btn-login">登 录</button>
    </form>

    <div class="login-footer">
      <span id="server-info">正在连接...</span>
    </div>
  </div>

  <script>
    (function() {
      var form = document.getElementById('login-form');
      var passInput = document.getElementById('password');
      var errorEl = document.getElementById('login-error');
      var btnLogin = document.getElementById('btn-login');
      var serverInfo = document.getElementById('server-info');

      // If already authenticated, go straight to admin
      if (sessionStorage.getItem('admin_auth') === '1') {
        location.href = '/admin/index.html';
        return;
      }

      // Check server health
      fetch('/api/admin/health')
        .then(function(r) { return r.json(); })
        .then(function(d) { serverInfo.textContent = '服务运行中 · ' + new Date().toLocaleTimeString(); })
        .catch(function() { serverInfo.textContent = '无法连接服务'; });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var pwd = passInput.value.trim();
        if (!pwd) return;

        btnLogin.disabled = true;
        btnLogin.textContent = '验证中...';
        errorEl.classList.remove('visible');

        fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            sessionStorage.setItem('admin_auth', '1');
            sessionStorage.setItem('admin_auth_time', Date.now());
            location.href = '/admin/index.html';
          } else {
            errorEl.textContent = data.message || '密码错误';
            errorEl.classList.add('visible');
            passInput.value = '';
            passInput.focus();
          }
        })
        .catch(function(err) {
          errorEl.textContent = '验证请求失败: ' + err.message;
          errorEl.classList.add('visible');
        })
        .finally(function() {
          btnLogin.disabled = false;
          btnLogin.textContent = '登 录';
        });
      });

      // Enter key already handled by form submit
    })();
  </script>
</body>
</html>
