<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 登录</title>
<link rel="stylesheet" href="/css/public.css?v=2.0.0">
<link rel="stylesheet" href="/admin/css/admin.css?v=2.0.0">
<style>
  .login-body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg-canvas);
    padding: 20px;
  }
  .login-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 44px 38px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-elevated);
    animation: fadeIn 0.4s ease;
    position: relative;
  }
  .login-card::before {
    content: "✦";
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 12px;
    color: var(--accent-gold-dim);
  }
  .login-card .logo {
    text-align: center;
    margin-bottom: 6px;
    font-size: 2.2rem;
    line-height: 1;
  }
  .login-card h1 {
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent-gold);
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }
  .login-card .subtitle {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-bottom: 30px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .login-card .version {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 28px;
    font-family: var(--font-mono);
  }
  .login-form .field {
    margin-bottom: 18px;
  }
  .login-form label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .login-form input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition);
  }
  .login-form input[type="password"]:focus {
    border-color: var(--accent-gold);
    box-shadow: 0 0 0 2px var(--accent-gold-bg);
  }
  .login-form input[type="password"]::placeholder {
    color: var(--text-muted);
  }
  .login-form .btn-login {
    width: 100%;
    padding: 12px;
    background: var(--accent-gold);
    border: none;
    border-radius: var(--radius-sm);
    color: #141322;
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition);
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .login-form .btn-login:hover { background: #DDC060; }
  .login-form .btn-login:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .login-error {
    display: none;
    padding: 10px 14px;
    background: var(--accent-red-bg);
    border: 1px solid rgba(212, 90, 90, 0.3);
    border-radius: var(--radius-sm);
    color: var(--accent-red);
    font-size: 0.85rem;
    margin-bottom: 18px;
    text-align: center;
  }
  .login-error.visible { display: block; }
  .login-footer {
    text-align: center;
    margin-top: 22px;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }
</style>
</head>
<body class="login-body">

<button class="theme-toggle-admin" onclick="toggleAdminTheme()" title="切换主题" style="position:fixed;top:12px;right:12px;z-index:101;">✦</button>

  <div class="login-card">
    <div class="logo">✦</div>
    <h1>fqnovel-unidbg</h1>
    <div class="subtitle">管理面板</div>

    <div class="login-error" id="login-error">密码错误，请重试</div>

    <form class="login-form" id="login-form" autocomplete="off">
      <div class="field">
        <label for="password">管理员密码</label>
        <input type="password" id="password" placeholder="············" autofocus>
      </div>
      <button type="submit" class="btn-login" id="btn-login">✦ 登 录 ✦</button>
    </form>

    <div class="login-footer">
      <span id="server-info">正在连接...</span>
      <a href="/dashboard.html" style="display:block;margin-top:10px;color:var(--accent-gold);text-decoration:none;font-size:0.82rem;">← 返回公开仪表盘</a>
    </div>
  </div>

  <script src="/js/public.js?v=2.0.0"></script>
  <script src="/admin/js/admin-common.js?v=2.0.0"></script>
  <script>
    (function() {
      var form = document.getElementById('login-form');
      var passInput = document.getElementById('password');
      var errorEl = document.getElementById('login-error');
      var btnLogin = document.getElementById('btn-login');
      var serverInfo = document.getElementById('server-info');

      // If already authenticated, go straight to dashboard
      if (sessionStorage.getItem('admin_auth') === '1') {
        location.href = '/admin/dashboard.html';
        return;
      }

      // Check server health
      fetch('/api/admin/health')
        .then(function(r) { return r.json(); })
        .then(function(d) { serverInfo.textContent = '✦ 服务运行中 · ' + new Date().toLocaleTimeString(); })
        .catch(function() { serverInfo.textContent = '✕ 无法连接服务'; });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var pwd = passInput.value.trim();
        if (!pwd) return;

        btnLogin.disabled = true;
        btnLogin.textContent = '✦ 验证中... ✦';
        errorEl.classList.remove('visible');

        fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            sessionStorage.setItem('admin_auth', '1');
            sessionStorage.setItem('admin_auth_time', Date.now());
            sessionStorage.setItem('admin_token', data.token);
            location.href = '/admin/dashboard.html';
          } else {
            errorEl.textContent = data.message || '✕ 密码错误';
            errorEl.classList.add('visible');
            passInput.value = '';
            passInput.focus();
          }
        })
        .catch(function(err) {
          errorEl.textContent = '✕ 验证请求失败: ' + err.message;
          errorEl.classList.add('visible');
        })
        .finally(function() {
          btnLogin.disabled = false;
          btnLogin.textContent = '✦ 登 录 ✦';
        });
      });
    })();
  </script>
</body>
</html>
