<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 全本下载</title>
<link rel="stylesheet" href="/css/public.css?v=2.0.0">
<link rel="stylesheet" href="/admin/css/admin.css?v=2.0.0">
</head>
<body>

<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="theme-toggle-admin" id="adminThemeToggle" onclick="toggleAdminTheme()" title="切换主题">✦</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="sidebar-subtitle">管理面板</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item" data-section="dashboard"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/admin/config.html" class="nav-item" data-section="config"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-settings"/></svg></span>配置编辑器</a>
    <a href="/admin/devices.html" class="nav-item" data-section="device-pool"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-device"/></svg></span>设备池管理</a>
    <a href="/admin/system.html" class="nav-item" data-section="system"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-monitor"/></svg></span>系统监控</a>
    <a href="/admin/search.html" class="nav-item" data-section="book-search"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/admin/download.html" class="nav-item" data-section="download"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/admin/books.html" class="nav-item" data-section="books"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/admin/reader.html" class="nav-item" data-section="chapter-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/admin/comments.html" class="nav-item" data-section="comment-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm btn-outline" onclick="lockPanel()" title="锁定面板">✦ 锁定</button>
    <a href="/dashboard.html" class="btn btn-sm btn-outline">← 返回公开面板</a>
  </div>
</aside>

<main class="content">
  <section class="section active" style="display:block;">
    <div class="section-header">
      <div class="section-header-main">
        <h2><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg> 全本下载管理</h2>
        <p class="section-header-desc">发起整本下载并跟踪任务进度,支持断点恢复(Ctrl+K 快速聚焦)</p>
      </div>
      <div class="section-header-actions">
        <button class="btn btn-accent" id="btn-check-status"><svg class="ic"><use href="/css/icons.svg#icon-refresh"/></svg> 检查所有</button>
        <button class="btn btn-primary" id="btn-resume-all"><svg class="ic"><use href="/css/icons.svg#icon-refresh"/></svg> 恢复所有</button>
      </div>
    </div>

    <!-- 控制栏 -->
    <div class="card mb-12">
      <div class="card-header">✦ 下载任务控制</div>
      <div class="card-body">
        <div class="search-bar">
          <input type="text" id="dl-book-id" class="search-input" style="max-width:220px;" placeholder="输入 Book ID" autocomplete="off">
          <input type="number" id="dl-batch-size" class="search-input" style="max-width:100px;" placeholder="批大小" value="30">
          <input type="number" id="dl-max-chapters" class="search-input" style="max-width:100px;" placeholder="最大章节(0=全部)" value="0">
          <button class="btn btn-primary" id="btn-start-download"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg> 开始下载</button>
          <button class="btn btn-sm" id="btn-resume-book"><svg class="ic"><use href="/css/icons.svg#icon-refresh"/></svg> 恢复下载</button>
        </div>
      </div>
    </div>

    <!-- 活跃下载 -->
    <div class="card mb-12">
      <div class="card-header">
        <svg class="ic"><use href="/css/icons.svg#icon-download"/></svg> 下载进度
        <span style="margin-left:12px;color:var(--text-muted);" id="dl-progress-count"></span>
      </div>
      <div class="card-body" id="dl-progress-area">
        <div style="text-align:center;padding:20px;color:var(--text-muted);" id="dl-no-active">✦ 暂无活跃下载任务</div>
        <div id="dl-progress-list"></div>
      </div>
    </div>

    <!-- 所有书籍状态 -->
    <div class="card">
      <div class="card-header">
        <svg class="ic"><use href="/css/icons.svg#icon-stats"/></svg> 所有书籍下载状态
        <span style="margin-left:12px;color:var(--text-muted);" id="dl-summary"></span>
      </div>
      <div class="card-body">
        <div class="table-wrapper">
          <table class="data-table" id="dl-status-table">
            <thead>
              <tr><th>书名</th><th>Book ID</th><th>进度</th><th>已下载 / 总数</th><th>完成度</th><th>操作</th></tr>
            </thead>
            <tbody id="dl-status-body">
              <tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 正在自动检查下载状态...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=2.0.0"></script>
<script src="/admin/js/admin-common.js?v=2.0.0"></script>
<script>
(function(){
  var _activeDownloads = {};
  var _statusTimer = null;

  async function startDownload() {
    var bookId = $('dl-book-id').value.trim();
    if (!bookId) { showToast('请输入 Book ID', 'error'); return; }
    var batchSize = parseInt($('dl-batch-size').value, 10) || 30;
    var maxChapters = parseInt($('dl-max-chapters').value, 10) || 0;

    var startBtn = $('btn-start-download');
    if (startBtn.disabled) return; // 流式期间禁止重复发起
    startBtn.disabled = true;
    showLoading();
    try {
      var resp = await fetch('/api/fullbook/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookId: bookId, batchSize: batchSize, maxChapters: maxChapters, saveToRedis: true, streamResponse: true })
      });
      if (!resp.ok) { showToast('下载请求失败: HTTP ' + resp.status, 'error'); return; }
      if (!resp.body) { showToast('响应无流式数据', 'error'); return; }

      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var hasData = false;

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        hasData = true;
        buffer += decoder.decode(result.value, { stream: true });
        var lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (var line of lines) {
          if (line.trim()) {
            try { var data = JSON.parse(line); updateProgress(data); } catch(e) {}
          }
        }
      }
      if (buffer.trim()) { try { var data = JSON.parse(buffer); updateProgress(data); } catch(e) {} }
      if (!hasData) showToast('下载任务已提交', 'success');
    } catch(e) { showToast('下载失败: ' + e.message, 'error'); }
    finally {
      hideLoading();
      startBtn.disabled = false;
    }
  }

  function updateProgress(data) {
    if (!data || !data.bookId) return;
    var bid = data.bookId;
    var bname = data.bookInfo && data.bookInfo.bookName ? data.bookInfo.bookName : bid;
    if (!_activeDownloads[bid]) _activeDownloads[bid] = { bookName: bname, total: 0, downloaded: 0, completed: false };
    var dl = _activeDownloads[bid];
    dl.bookName = data.bookInfo && data.bookInfo.bookName ? data.bookInfo.bookName : bname;
    if (data.totalChapters != null) dl.total = data.totalChapters;
    if (data.downloadedChapters != null) dl.downloaded = data.downloadedChapters;
    if (data.completed) dl.completed = true;
    if (data.completed) showToast('下载完成: ' + dl.bookName, 'success');
    renderActiveDownloads();
    scheduleStatusCheck();
  }

  // 流式进度事件高频触发时,将多次 checkAllStatus 合并为一次(与公开侧 T6 节流一致)
  function scheduleStatusCheck() {
    if (_statusTimer) return;
    _statusTimer = setTimeout(function() { _statusTimer = null; checkAllStatus(true); }, 800);
  }

  // T9 进度条细化:每任务显示完成度百分比与状态徽章,进度条上带数值标签
  function renderActiveDownloads() {
    var container = $('dl-progress-list');
    var noActive = $('dl-no-active');
    var activeKeys = Object.keys(_activeDownloads).filter(function(k){ return !_activeDownloads[k].completed; });
    if (activeKeys.length === 0) {
      if (noActive) noActive.style.display = '';
      container.innerHTML = '';
      $('dl-progress-count').textContent = '';
      return;
    }
    if (noActive) noActive.style.display = 'none';
    container.innerHTML = activeKeys.map(function(k){
      var dl = _activeDownloads[k];
      var pct = dl.total > 0 ? Math.round(dl.downloaded / dl.total * 100) : 0;
      return '<div style="padding:12px 0;border-bottom:1px solid var(--border-light);">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">' +
        '<span style="font-weight:600;">' + escapeHtml(dl.bookName) + '</span>' +
        '<span><span class="badge ' + (pct >= 100 ? 'badge-green' : 'badge-gold') + '">' + (pct >= 100 ? '已完成' : '下载中') + '</span>' +
        '<span style="font-size:0.82rem;color:var(--text-secondary);font-family:var(--font-mono);margin-left:8px;">' + dl.downloaded + ' / ' + dl.total + ' 章 · ' + pct + '%</span></span></div>' +
        '<div class="progress-bar" style="height:8px;margin-bottom:4px;"><div class="progress-fill" style="width:' + pct + '%;background:' + (pct>=100?'var(--accent-green)':'var(--accent-gold)') + ';"></div></div></div>';
    }).join('');
    $('dl-progress-count').textContent = activeKeys.length + ' 个活跃任务';
  }

  async function checkAllStatus(silent) {
    if (!silent) showLoading();
    try {
      var resp = await fetch('/api/fullbook/check-all-status');
      var result = await resp.json();
      if (!result || !result.success) { showToast((result&&result.message)||'检查失败', 'error'); return; }
      renderStatusTable(result.books);
      $('dl-summary').textContent = '共 ' + (result.books.totalBooks||0) + ' 本，已完成 ' + ((result.books.completeBooks||[]).length) + ' 本';
    } catch(e) { if (!silent) showToast('检查失败: ' + e.message, 'error'); }
    finally { if (!silent) hideLoading(); }
  }

  function renderStatusTable(data) {
    var tbody = $('dl-status-body');
    if (!data || !data.totalBooks) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 暂无数据</td></tr>'; return; }
    var books = (data.completeBooks || []).concat(data.incompleteBookList || []);
    if (!books.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 暂无数据</td></tr>'; return; }
    tbody.innerHTML = books.map(function(b){
      var pct = b.progress != null ? Math.round(b.progress) : 0;
      var completed = b.completed ? true : false;
      var statusText = completed ? '<span class="badge badge-green">已完成</span>' : '<span class="badge badge-gold">下载中</span>';
      return '<tr><td><a href="/admin/books.html?bookId='+encodeURIComponent(b.bookId)+'" style="font-weight:600;">'+escapeHtml(b.bookName||'--')+'</a></td>' +
        '<td style="font-size:0.75rem;font-family:var(--font-mono);">'+escapeHtml(b.bookId)+'</td>' +
        '<td style="min-width:140px;"><div style="display:flex;align-items:center;gap:6px;"><div class="progress-bar" style="flex:1;height:6px;"><div class="progress-fill" style="width:'+pct+'%;background:'+(completed?'var(--accent-green)':(pct>0?'var(--accent-gold)':'var(--text-muted)'))+';"></div></div><span style="font-size:0.72rem;color:var(--text-muted);font-family:var(--font-mono);min-width:36px;text-align:right;">'+pct+'%</span></div></td>' +
        '<td style="font-family:var(--font-mono);">'+(b.downloadedChapters!=null?b.downloadedChapters:'?')+' / '+(b.totalChapters!=null?b.totalChapters:'?')+'</td>' +
        '<td>'+statusText+'</td>' +
        '<td><button class="btn btn-sm btn-outline resume-book-btn" data-book-id="'+escapeHtml(b.bookId)+'" '+(completed?'disabled':'')+'><svg class="ic"><use href="/css/icons.svg#icon-refresh"/></svg> 恢复</button> <button class="btn btn-sm btn-danger delete-book-btn" data-book-id="'+escapeHtml(b.bookId)+'">删除</button></td></tr>';
    }).join('');
    tbody.querySelectorAll('.resume-book-btn').forEach(function(btn){ btn.addEventListener('click', function(){ autoResumeBook(this.dataset.bookId); }); });
    tbody.querySelectorAll('.delete-book-btn').forEach(function(btn){ btn.addEventListener('click', function(){ deleteBook(this.dataset.bookId); }); });
  }

  async function autoResumeBook(bookId) {
    if (!bookId) return;
    showLoading();
    try {
      var resp = await fetch('/api/fullbook/auto-resume/'+encodeURIComponent(bookId), { method: 'POST' });
      var result = await resp.json();
      if (result.success) { showToast(result.message||'恢复下载已启动', 'success'); setTimeout(checkAllStatus, 2000); }
      else showToast(result.message||'恢复失败', 'error');
    } catch(e) { showToast('恢复失败: '+e.message, 'error'); }
    finally { hideLoading(); }
  }

  async function resumeAll() {
    showLoading();
    try {
      var resp = await fetch('/api/fullbook/auto-resume-all', { method: 'POST' });
      var result = await resp.json();
      if (result.success) { showToast(result.message||'已启动批量恢复', 'success'); setTimeout(checkAllStatus, 3000); }
      else showToast(result.message||'批量恢复失败', 'error');
    } catch(e) { showToast('批量恢复失败: '+e.message, 'error'); }
    finally { hideLoading(); }
  }

  async function deleteBook(bookId) {
    if (!bookId) return;
    var ok = await confirmDialog('删除已下载章节', '确定要删除书籍 '+bookId+' 的所有已下载章节吗？此操作不可撤销。');
    if (!ok) return;
    showLoading();
    try {
      var resp = await fetch('/api/fullbook/chapters/'+encodeURIComponent(bookId), { method: 'DELETE' });
      var result = await resp.json();
      if (result.success) { showToast('删除成功', 'success'); checkAllStatus(); }
      else showToast(result.message||'删除失败', 'error');
    } catch(e) { showToast('删除失败: '+e.message, 'error'); }
    finally { hideLoading(); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    $('btn-start-download').addEventListener('click', startDownload);
    $('btn-check-status').addEventListener('click', function(){ checkAllStatus(); });
    $('btn-resume-all').addEventListener('click', function(){ resumeAll(); });
    $('btn-resume-book').addEventListener('click', function(){
      var bid = $('dl-book-id').value.trim();
      if (bid) autoResumeBook(bid); else showToast('请输入 Book ID', 'error');
    });
    $('dl-book-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') startDownload(); });
    checkAllStatus();

    // T9 快捷键:Ctrl+K 聚焦 Book ID
    registerShortcut('ctrl+k', function(e){ e.preventDefault(); var b = $('dl-book-id'); if (b) { b.focus(); b.select(); } });
  });
})();
</script>
</body>
</html>
