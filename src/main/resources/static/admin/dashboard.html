<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 概览仪表盘</title>
<link rel="stylesheet" href="/css/public.css?v=2.0.0">
<link rel="stylesheet" href="/admin/css/admin.css?v=2.0.0">
</head>
<body>

<button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="theme-toggle-admin" id="adminThemeToggle" onclick="toggleAdminTheme()" title="切换主题">✦</button>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="sidebar-subtitle">管理面板</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/admin/dashboard.html" class="nav-item" data-section="dashboard"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/admin/config.html" class="nav-item" data-section="config"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-settings"/></svg></span>配置编辑器</a>
    <a href="/admin/devices.html" class="nav-item" data-section="device-pool"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-device"/></svg></span>设备池管理</a>
    <a href="/admin/system.html" class="nav-item" data-section="system"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-monitor"/></svg></span>系统监控</a>
    <a href="/admin/search.html" class="nav-item" data-section="book-search"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/admin/download.html" class="nav-item" data-section="download"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/admin/books.html" class="nav-item" data-section="books"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/admin/reader.html" class="nav-item" data-section="chapter-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/admin/comments.html" class="nav-item" data-section="comment-viewer"><span class="nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm btn-outline" onclick="lockPanel()" title="锁定面板">✦ 锁定</button>
    <a href="/dashboard.html" class="btn btn-sm btn-outline">← 返回公开面板</a>
  </div>
</aside>

<main class="content">
  <section class="section active" style="display:block;">
    <div class="section-header">
      <h2>概览仪表盘</h2>
      <button class="btn btn-sm" id="btn-refresh-dashboard"><svg class="ic"><use href="/css/icons.svg#icon-refresh"/></svg> 刷新</button>
    </div>
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">JVM 内存</div>
        <div class="card-body">
          <div class="progress-bar" id="mem-bar"><div class="progress-fill"></div></div>
          <div class="metric-row"><span>已用</span><span id="mem-used">--</span></div>
          <div class="metric-row"><span>最大</span><span id="mem-max">--</span></div>
          <div class="metric-row"><span>使用率</span><span id="mem-pct">--</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">线程</div>
        <div class="card-body">
          <div class="big-number" id="thread-active">--</div>
          <div class="metric-label">活跃线程</div>
          <div class="metric-row"><span>总线程数</span><span id="thread-total">--</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">设备池</div>
        <div class="card-body">
          <div class="big-number" id="pool-size">--</div>
          <div class="metric-label">当前 / 目标</div>
          <div class="metric-row"><span>启用</span><span id="pool-enabled">--</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Redis</div>
        <div class="card-body">
          <div class="status-indicator" id="redis-status"><span class="dot"></span><span id="redis-text">--</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">签名缓存</div>
        <div class="card-body">
          <div class="metric-row"><span>命中率</span><span id="cache-hitrate">--</span></div>
          <div class="metric-row"><span>缓存数量</span><span id="cache-size">--</span></div>
          <div class="metric-row"><span>命中/未命中</span><span id="cache-hits">--</span></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">磁盘</div>
        <div class="card-body">
          <div class="progress-bar" id="disk-bar"><div class="progress-fill"></div></div>
          <div class="metric-row"><span>可用</span><span id="disk-free">--</span></div>
          <div class="metric-row"><span>总量</span><span id="disk-total">--</span></div>
          <div class="metric-row"><span>使用率</span><span id="disk-pct">--</span></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=2.0.0"></script>
<script src="/admin/js/admin-common.js?v=2.0.0"></script>
<script>
(function(){
  async function refreshDashboard() {
    var data = await safeFetch(function(){ return apiGet('/monitor'); }, '加载监控数据失败');
    if (!data) return;

    var jvm = data.jvm || {};
    var memPct = jvm.memoryUsagePercent || 0;
    var mbar = qs('#mem-bar .progress-fill');
    if (mbar) { mbar.style.width = Math.min(memPct, 100) + '%'; mbar.className = 'progress-fill' + (memPct > 85 ? ' danger' : memPct > 65 ? ' warning' : ''); }
    $('mem-used').textContent = formatBytes(jvm.usedMemory || 0);
    $('mem-max').textContent = formatBytes(jvm.maxMemory || 0);
    $('mem-pct').textContent = formatPercent(memPct);

    var th = data.threads || {};
    $('thread-active').textContent = th.activeCount != null ? th.activeCount : '--';
    $('thread-total').textContent = th.totalCount != null ? th.totalCount : '--';

    var pool = data.devicePool || {};
    $('pool-size').textContent = (pool.currentSize != null ? pool.currentSize : '--') + ' / ' + (pool.targetSize != null ? pool.targetSize : '--');
    $('pool-enabled').textContent = pool.enabled ? '已启用' : '未启用';

    var redis = data.redis || {};
    var rd = qs('#redis-status .dot');
    if (rd) rd.className = 'dot ' + (redis.connected ? 'green' : 'red');
    $('redis-text').textContent = redis.connected ? '已连接' : (redis.error ? '连接失败' : '未配置');

    var cache = data.signatureCache || {};
    $('cache-hitrate').textContent = cache.hitRate != null ? (cache.hitRate * 100).toFixed(1) + '%' : '--';
    $('cache-size').textContent = cache.cacheSize != null ? cache.cacheSize : (cache.size != null ? cache.size : '--');
    $('cache-hits').textContent = (cache.hits != null ? cache.hits : '--') + ' / ' + (cache.misses != null ? cache.misses : '--');

    var disk = data.disk || {};
    var diskPct = disk.usedPercent || 0;
    var dbar = qs('#disk-bar .progress-fill');
    if (dbar) { dbar.style.width = Math.min(diskPct, 100) + '%'; dbar.className = 'progress-fill' + (diskPct > 85 ? ' danger' : diskPct > 65 ? ' warning' : ''); }
    $('disk-free').textContent = formatBytes((disk.freeSpaceMB || 0) * 1024 * 1024);
    $('disk-total').textContent = formatBytes((disk.totalSpaceMB || 0) * 1024 * 1024);
    $('disk-pct').textContent = formatPercent(diskPct);
  }

  document.addEventListener('DOMContentLoaded', function() {
    refreshDashboard();
    $('btn-refresh-dashboard').addEventListener('click', refreshDashboard);
  });
})();
</script>
</body>
</html>
