<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Dashboard: 4 grid / window layout -->
  <symbol id="icon-dashboard" viewBox="0 0 24 24">
    <rect x="3" y="3" width="8" height="8" rx="1.5"/>
    <rect x="13" y="3" width="8" height="8" rx="1.5"/>
    <rect x="3" y="13" width="8" height="8" rx="1.5"/>
    <rect x="13" y="13" width="8" height="8" rx="1.5"/>
  </symbol>

  <!-- Search: magnifying glass -->
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="7"/>
    <line x1="15.5" y1="15.5" x2="21" y2="21"/>
  </symbol>

  <!-- Book: open book -->
  <symbol id="icon-book" viewBox="0 0 24 24">
    <path d="M4 19.5v-15A1.5 1.5 0 0 1 5.5 3H11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 18.5z"/>
    <path d="M12 19V4a1 1 0 0 1 1-1h5.5A1.5 1.5 0 0 1 20 4.5v15A1.5 1.5 0 0 1 18.5 21H13a1 1 0 0 1-1-1z"/>
    <line x1="12" y1="7" x2="20" y2="7"/>
    <line x1="4" y1="7" x2="12" y2="7"/>
  </symbol>

  <!-- Comment: chat bubble -->
  <symbol id="icon-comment" viewBox="0 0 24 24">
    <path d="M21 12a9 9 0 0 1-9 9H4l2.5-3.5A9 9 0 1 1 21 12z"/>
  </symbol>

  <!-- Download: arrow down + line -->
  <symbol id="icon-download" viewBox="0 0 24 24">
    <line x1="12" y1="3" x2="12" y2="15"/>
    <polyline points="7,10 12,15 17,10"/>
    <line x1="4" y1="19" x2="20" y2="19"/>
  </symbol>

  <!-- API: plug / connection node -->
  <symbol id="icon-api" viewBox="0 0 24 24">
    <path d="M13.5 3H10a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h3.5a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1z"/>
    <path d="M14 9v2.5a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2V9"/>
    <line x1="12" y1="13.5" x2="12" y2="18"/>
    <line x1="9" y1="18" x2="15" y2="18"/>
  </symbol>

  <!-- Settings: gear -->
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </symbol>

  <!-- Device: phone -->
  <symbol id="icon-device" viewBox="0 0 24 24">
    <rect x="5" y="2" width="14" height="20" rx="2.5"/>
    <line x1="12" y1="18" x2="12.01" y2="18"/>
  </symbol>

  <!-- Monitor: screen / monitor -->
  <symbol id="icon-monitor" viewBox="0 0 24 24">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <line x1="8" y1="21" x2="16" y2="21"/>
    <line x1="12" y1="17" x2="12" y2="21"/>
  </symbol>

  <!-- Admin: shield -->
  <symbol id="icon-admin" viewBox="0 0 24 24">
    <path d="M12 2l7 4v5a7 7 0 0 1-7 7 7 7 0 0 1-7-7V6l7-4z"/>
    <line x1="9" y1="12" x2="11" y2="14"/>
    <line x1="15" y1="10" x2="11" y2="14"/>
  </symbol>

  <!-- Lock: padlock -->
  <symbol id="icon-lock" viewBox="0 0 24 24">
    <rect x="5" y="11" width="14" height="10" rx="2"/>
    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    <circle cx="12" cy="16" r="1.5"/>
  </symbol>

  <!-- Refresh: rotating arrow -->
  <symbol id="icon-refresh" viewBox="0 0 24 24">
    <polyline points="23,4 23,10 17,10"/>
    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
  </symbol>

  <!-- Chevron Left -->
  <symbol id="icon-chevron-left" viewBox="0 0 24 24">
    <polyline points="15,18 9,12 15,6"/>
  </symbol>

  <!-- Chevron Right -->
  <symbol id="icon-chevron-right" viewBox="0 0 24 24">
    <polyline points="9,18 15,12 9,6"/>
  </symbol>
</svg>
