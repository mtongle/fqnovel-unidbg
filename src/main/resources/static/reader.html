<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 章节阅读</title>
<link rel="stylesheet" href="/css/public.css?v=0.0.6">
</head>
<body>

<button class="public-mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="public-theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">✦</button>

<aside class="public-sidebar">
  <div class="public-sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="public-sidebar-subtitle">公开面板</span>
  </div>
  <nav class="public-sidebar-nav">
    <a href="/dashboard.html" class="public-nav-item" data-section="dashboard"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/search.html" class="public-nav-item" data-section="book-search"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/reader.html" class="public-nav-item active" data-section="chapter-viewer"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/comments.html" class="public-nav-item" data-section="comment-viewer"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
    <a href="/download.html" class="public-nav-item" data-section="download"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/books.html" class="public-nav-item" data-section="books"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/api.html" class="public-nav-item" data-section="api"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-api"/></svg></span>API 文档</a>
  </nav>
  <div class="public-sidebar-footer">
    <a href="/admin/dashboard.html" class="btn btn-sm btn-outline" style="width:100%;display:flex;text-decoration:none;gap:6px;">← 返回管理后台</a>
  </div>
</aside>

<main class="public-content">
  <section class="section active" style="display:block;">
    <div class="section-header"><h2>✦ 章节阅读</h2></div>
    <div class="card mb-12">
      <div class="card-body">
        <div class="search-bar">
          <input type="text" id="cv-book-id" class="search-input" style="max-width:180px;" placeholder="Book ID" autocomplete="off">
          <input type="text" id="cv-chapter-id" class="search-input" style="max-width:180px;" placeholder="Chapter ID" autocomplete="off">
          <button class="btn btn-primary" id="btn-cv-load">✦ 加载</button>
          <button class="btn btn-sm" id="btn-cv-prev" disabled>← 上一章</button>
          <button class="btn btn-sm" id="btn-cv-next" disabled>下一章 →</button>
          <a href="/comments.html" class="btn btn-sm btn-accent" id="btn-cv-comments"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg> 段评</a>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header" id="cv-title">✦ 章节标题</div>
      <div class="card-body">
        <div class="chapter-content" id="cv-content"><div class="detail-empty">✦ 输入 Book ID 和 Chapter ID 加载章节</div></div>
      </div>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <a href="/admin/dashboard.html" class="btn btn-sm btn-outline"><svg class="ic"><use href="/css/icons.svg#icon-chevron-left"/></svg> 返回管理后台</a>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=0.0.6"></script>
<script>
(function(){
  var _state = { bookId: null, chapterId: null, prevId: null, nextId: null };

  async function loadChapter() {
    var bookId = $('cv-book-id').value.trim();
    var chapterId = $('cv-chapter-id').value.trim();
    if (!bookId || !chapterId) { showToast('请输入 Book ID 和 Chapter ID', 'error'); return; }
    $('btn-cv-prev').disabled = true;
    $('btn-cv-next').disabled = true;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqnovel/chapter/' + encodeURIComponent(bookId) + '/' + encodeURIComponent(chapterId));
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'获取章节失败', 'error'); $('cv-content').innerHTML = '<div class="detail-empty">获取章节失败</div>'; return; }
      var data = resp.data;
      if (!data) return;
      _state.bookId = data.bookId;
      _state.chapterId = data.chapterId;
      _state.prevId = data.prevChapterId;
      _state.nextId = data.nextChapterId;
      $('cv-title').textContent = data.title || ('章节 ' + data.chapterId);
      $('cv-content').innerHTML = (data.txtContent || data.rawContent || '内容为空').replace(/\n/g, '<br>');
      $('btn-cv-prev').disabled = !data.prevChapterId;
      $('btn-cv-next').disabled = !data.nextChapterId;
      var cmLink = $('btn-cv-comments');
      if (cmLink) { var p = new URLSearchParams(); p.set('bookId', data.bookId||''); p.set('chapterId', data.chapterId||''); cmLink.href = '/comments.html?' + p.toString(); }
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); $('cv-content').innerHTML = '<div class="detail-empty">加载出错: ' + escapeHtml(e.message) + '</div>'; }
    finally { hideLoading(); }
  }

  function prevChapter() { if (_state.prevId) { $('cv-chapter-id').value = _state.prevId; loadChapter(); } }
  function nextChapter() { if (_state.nextId) { $('cv-chapter-id').value = _state.nextId; loadChapter(); } }

  document.addEventListener('DOMContentLoaded', function() {
    var params = new URLSearchParams(location.search);
    if (params.get('bookId')) $('cv-book-id').value = params.get('bookId');
    if (params.get('chapterId')) { $('cv-chapter-id').value = params.get('chapterId'); loadChapter(); }
    $('btn-cv-load').addEventListener('click', loadChapter);
    $('btn-cv-prev').addEventListener('click', prevChapter);
    $('btn-cv-next').addEventListener('click', nextChapter);
    $('cv-chapter-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadChapter(); });
    $('cv-book-id').addEventListener('keydown', function(e){ if (e.key === 'Enter') loadChapter(); });

    // Mobile sidebar toggle
    var menuBtn = $('mobile-menu-toggle');
    var sidebar = document.querySelector('.public-sidebar');
    if (menuBtn && sidebar) {
      menuBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); });
      document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768 && sidebar.classList.contains('open') &&
            !sidebar.contains(e.target) && e.target !== menuBtn) {
          sidebar.classList.remove('open');
        }
      });
    }
  });
})();
</script>
</body>
</html>
