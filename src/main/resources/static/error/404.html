<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面未找到</title>
<style>
  :root {
    --ink: #2A2A33;
    --paper: #F7F2E7;
    --vermilion: #B03A2E;
    --gold: #C4A84A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background-image: radial-gradient(ellipse at 50% 40%, rgba(196,168,74,0.10), rgba(247,242,231,0) 70%);
  }
  .seal {
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    background: var(--vermilion);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--paper);
    font-size: 30px;
    line-height: 1;
    box-shadow: 0 2px 8px rgba(176,58,46,0.35);
  }
  .box {
    text-align: center;
    max-width: 560px;
    border-top: 3px solid var(--gold);
    border-bottom: 1px dashed rgba(42,42,51,0.35);
    padding: 40px 32px;
  }
  .code {
    font-size: 96px;
    font-weight: 700;
    color: var(--vermilion);
    letter-spacing: 6px;
    line-height: 1.1;
  }
  .title {
    margin-top: 12px;
    font-size: 22px;
    letter-spacing: 2px;
  }
  .desc {
    margin-top: 14px;
    font-size: 15px;
    color: rgba(42,42,51,0.72);
    line-height: 1.8;
    letter-spacing: 1px;
  }
  a.home {
    display: inline-block;
    margin-top: 26px;
    padding: 10px 32px;
    border: 1px solid var(--vermilion);
    border-radius: 4px;
    color: var(--vermilion);
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 15px;
    transition: all 0.2s;
  }
  a.home:hover {
    background: var(--vermilion);
    color: var(--paper);
  }
</style>
</head>
<body>
  <main class="box">
    <div class="seal" aria-hidden="true">失</div>
    <div class="code">404</div>
    <h1 class="title">此页未收录</h1>
    <p class="desc">书卷浩繁,亦有卷次散佚。<br>您所求之页不在架中,或已被移往他处。</p>
    <a class="home" href="/index.html">返回首页</a>
  </main>
</body>
</html>
