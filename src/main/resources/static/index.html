<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ fqnovel-unidbg</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #141322;
    color: #EEE8D8;
    font-family: "Noto Serif SC", "Source Han Serif SC", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .loader { text-align: center; }
  .loader .mark {
    font-size: 2rem;
    color: #C4A84A;
    margin-bottom: 12px;
    opacity: 0.6;
  }
  .loader .spinner {
    width: 36px; height: 36px;
    border: 3px solid #2D2C4A;
    border-top-color: #C4A84A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: #7A6E5E; font-size: 0.85rem; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="loader">
    <div class="mark">✦</div>
    <div class="spinner"></div>
    <p>正在跳转至管理面板 ...</p>
  </div>
  <script>location.href = '/admin/login.html';</script>
</body>
</html>
