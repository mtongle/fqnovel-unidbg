<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fqnovel-unidbg · 书籍搜索</title>
<link rel="stylesheet" href="/css/public.css?v=2.0.0">
<style>

/* ── Detail Modal ── */
/* F28 去重:.book-detail 基础样式已由 public.css(v2) 提供;此处仅保留弹层内差异覆盖 —— 展开完整描述(public.css 默认 80px 内滚动) */
.book-detail-info .desc {
  max-height: none;
  overflow: visible;
}
.detail-modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}
.detail-modal {
  display: flex;
  align-items: flex-start;
  background: var(--bg-raised);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-elevated);
  width: 90vw;
  max-width: 960px;
  max-height: 85vh;
  position: relative;
  animation: fadeIn 0.25s ease;
  overflow-y: auto;
}
.detail-modal-close {
  position: absolute;
  top: 10px; right: 12px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.4rem;
  cursor: pointer;
  z-index: 10;
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: all var(--transition);
}
.detail-modal-close:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}
.detail-modal-left {
  flex: 0 0 400px;
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 0;
}
.detail-modal-cover-area {
  display: flex;
  justify-content: center;
}
.detail-modal-cover-area .book-detail-cover {
  width: 140px;
  border-radius: var(--radius-sm);
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.detail-modal-divider {
  flex: 0 0 1px;
  background: var(--border-color);
}
.detail-modal-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.detail-modal-right-header {
  padding: 20px 24px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--bg-raised);
  z-index: 1;
}
.detail-modal-toc-list {
  padding: 8px 0;
}
.detail-modal-toc-item {
  border-bottom: 1px solid var(--border-light);
}
.detail-modal-toc-item:last-child {
  border-bottom: none;
}
.toc-chapter-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  text-decoration: none;
  color: var(--text-primary);
  transition: background var(--transition);
}
.toc-chapter-link:hover {
  background: var(--bg-hover);
  text-decoration: none;
}
.toc-chapter-num {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--accent-gold-bg);
  color: var(--accent-gold);
  font-size: 0.72rem;
  font-weight: 600;
  font-family: var(--font-mono);
}
.toc-chapter-title {
  flex: 1;
  font-size: 0.82rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-chapter-meta {
  flex-shrink: 0;
  font-size: 0.68rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
@media (max-width: 768px) {
  .detail-modal {
    flex-direction: column;
    width: 94vw;
    max-height: 92vh;
  }
  .detail-modal-left {
    flex: none;
    padding: 20px 16px;
    gap: 14px;
    position: static;
  }
  .detail-modal-divider {
    flex: 0 0 1px;
    width: 100%;
  }
}
</style>
</head>
<body>

<button class="public-mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
<button class="public-theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">✦</button>

<aside class="public-sidebar">
  <div class="public-sidebar-header">
    <h1>fqnovel-unidbg</h1>
    <span class="public-sidebar-subtitle">公开面板</span>
  </div>
  <nav class="public-sidebar-nav">
    <a href="/dashboard.html" class="public-nav-item" data-section="dashboard"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-dashboard"/></svg></span>概览仪表盘</a>
    <a href="/search.html" class="public-nav-item active" data-section="book-search"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-search"/></svg></span>书籍搜索</a>
    <a href="/reader.html" class="public-nav-item" data-section="chapter-viewer"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>章节阅读</a>
    <a href="/comments.html" class="public-nav-item" data-section="comment-viewer"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-comment"/></svg></span>段评查询</a>
    <a href="/download.html" class="public-nav-item" data-section="download"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg></span>全本下载</a>
    <a href="/books.html" class="public-nav-item" data-section="books"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg></span>已下载书籍</a>
    <a href="/api.html" class="public-nav-item" data-section="api"><span class="public-nav-icon"><svg class="ic"><use href="/css/icons.svg#icon-api"/></svg></span>API 文档</a>
  </nav>
  <div class="public-sidebar-footer">
    <a href="/admin/dashboard.html" class="btn btn-sm btn-outline" style="width:100%;display:flex;text-decoration:none;gap:6px;">← 返回管理后台</a>
  </div>
</aside>

<main class="public-content">
  <section class="section active" style="display:block;">
    <div class="section-header">
      <div class="section-header-main">
        <h2>✦ 书籍搜索</h2>
        <p class="section-header-desc">按书名 / 作者关键词搜索番茄小说全量书目(Ctrl+K 快速聚焦)</p>
      </div>
    </div>
    <div class="card mb-12">
      <div class="card-body">
        <div class="search-bar">
          <select id="bs-tab-type" class="search-select">
            <option value="1">综合</option><option value="3">书籍</option><option value="5">全文</option>
          </select>
          <input type="text" id="bs-query" class="search-input" placeholder="输入书名/作者关键词" autocomplete="off">
          <button class="btn btn-primary" id="btn-bs-search">✦ 搜索</button>
          <button class="btn btn-outline" id="btn-bs-clear">✦ 清空</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">搜索结果 <span id="bs-result-count" class="text-muted"></span></div>
      <div class="card-body">
        <div class="table-wrapper">
          <table class="data-table" id="bs-result-table">
            <thead><tr><th>书名</th><th>作者</th><th>状态</th><th>字数</th><th>评分</th><th>分类</th><th>操作</th></tr></thead>
            <tbody id="bs-result-body"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 输入关键词开始搜索</td></tr></tbody>
          </table>
        </div>
        <div class="pagination" id="bs-pagination"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner"></div>
</div>

<script src="/js/public.js?v=2.0.0"></script>
<script>
(function(){
  var _state = { offset: 0, query: '', tabType: 1 };

  async function searchBooks(offset) {
    var query = $('bs-query').value.trim();
    if (!query) { showToast('请输入搜索关键词', 'error'); return; }
    if (offset == null) offset = 0;
    _state.query = query;
    _state.tabType = parseInt($('bs-tab-type').value, 10);
    _state.offset = offset;
    showLoading();
    try {
      var resp = await apiGetDirect('/api/fqsearch/books?query=' + encodeURIComponent(query)
        + '&tabType=' + _state.tabType + '&offset=' + offset + '&count=20');
      if (!resp || resp.code !== 0) { showToast((resp&&resp.message)||'搜索失败', 'error'); return; }
      renderResults(resp.data);
    } catch(e) { showToast('搜索请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  function renderResults(data) {
    var books = (data && data.books) || [];
    var total = data && data.total;
    var body = $('bs-result-body');
    var count = $('bs-result-count');
    if (count) count.textContent = total != null ? '（共 ' + total + ' 条）' : '';
    if (!books.length) {
      body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">未找到结果</td></tr>';
      renderPagination($('bs-pagination'), 0, 1);
      return;
    }
    body.innerHTML = books.map(function(b){
      var coverSrc = normalizeImageUrl(b.coverUrl||'');
      var img = coverSrc ? '<img src="'+escapeHtml(coverSrc)+'" onerror="fixHeicImg(this)" style="width:32px;height:44px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:6px;">' : '';
      return '<tr><td>'+img+'<span>'+escapeHtml(b.bookName||'--')+'</span></td><td>'+escapeHtml(b.author||'--')+'</td><td>'+bookStatusText(b.status)+'</td><td>'+formatWordCount(b.wordCount)+'</td><td>'+(b.rating!=null?b.rating:'--')+'</td><td>'+escapeHtml(b.category||'--')+'</td><td><button class="btn btn-sm btn-primary bs-view-detail" data-book-id="'+escapeHtml(b.bookId)+'">详情</button></td></tr>';
    }).join('');
    body.querySelectorAll('.bs-view-detail').forEach(function(btn){
      btn.addEventListener('click', function(){ showBookDetail(this.dataset.bookId); });
    });
    renderPagination($('bs-pagination'), _state.offset, total!=null ? Math.ceil(total/20) : 1, function(pageOffset){ searchBooks(pageOffset); });
  }

  function renderPagination(container, currentOffset, totalPages, onPageClick) {
    if (!container) return;
    if (totalPages <= 1 && currentOffset === 0) { container.innerHTML = ''; return; }
    var cur = Math.floor(currentOffset / 20) + 1;
    var h = '';
    if (cur > 1) h += '<button class="page-btn" data-offset="' + (currentOffset - 20) + '">上一页</button>';
    var start = Math.max(1, cur - 2);
    var end = Math.min(totalPages, cur + 2);
    for (var i = start; i <= end; i++) { var off = (i - 1) * 20; h += '<button class="page-btn' + (i === cur ? ' active' : '') + '" data-offset="' + off + '">' + i + '</button>'; }
    if (cur < totalPages) h += '<button class="page-btn" data-offset="' + (currentOffset + 20) + '">下一页</button>';
    h += '<span class="page-info">' + cur + '/' + totalPages + '</span>';
    container.innerHTML = h;
    if (onPageClick) { container.querySelectorAll('.page-btn').forEach(function(btn){ btn.addEventListener('click', function(){ if (!this.disabled) onPageClick(parseInt(this.dataset.offset, 10)); }); }); }
  }

  async function showBookDetail(bookId) {
    if (!bookId) return;
    showLoading();
    try {
      var [detailResp, dirResp] = await Promise.all([
        apiGetDirect('/api/fqnovel/book/' + encodeURIComponent(bookId)),
        apiGetDirect('/api/fqsearch/directory/' + encodeURIComponent(bookId))
      ]);
      if (!detailResp || detailResp.code !== 0) { showToast((detailResp&&detailResp.message)||'获取详情失败', 'error'); return; }
      var d = detailResp.data;
      var dirItems = (dirResp && dirResp.code === 0 && (dirResp.data && (dirResp.data.itemDataList || dirResp.data.item_data_list))) || [];
      var coverUrl = normalizeImageUrl(d.coverUrl);
      var coverHtml = coverUrl ? '<img class="book-detail-cover" src="'+escapeHtml(coverUrl)+'" alt="cover" onerror="fixHeicImg(this)">' : '<div style="width:140px;height:200px;background:var(--bg-tertiary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:2rem;">📖</div>';
      var fch = d.firstChapterItemId || '';
      var vipHtml = '';
      if (d.vipBook === true || d.vipBook === '1' || d.vipBook === 'true') { vipHtml = '<div style="padding:6px 0;display:flex;justify-content:space-between;font-size:0.85rem;border-bottom:1px solid rgba(255,255,255,0.04);"><span style="color:var(--text-secondary);">付费</span><span style="color:var(--text-primary);font-weight:500;">是</span></div>'; }
      var tocHtml = !dirItems.length
        ? '<div style="text-align:center;padding:40px 20px;color:var(--text-muted);font-size:0.85rem;">暂无目录数据</div>'
        : '<div class="detail-modal-toc-list">' + dirItems.map(function(item, idx){
            var ci = item.chapter_index || item.chapterIndex || idx + 1;
            var iid = item.item_id || item.itemId;
            var cwn = item.chapter_word_number || item.chapterWordNumber;
            var ct = item.chapter_type || item.chapterType;
            var isf = item.is_free != null ? item.is_free : item.isFree;
            return '<div class="detail-modal-toc-item"><a href="/reader.html?bookId='+encodeURIComponent(bookId)+'&chapterId='+encodeURIComponent(iid)+'" class="toc-chapter-link"><span class="toc-chapter-num">'+ci+'</span><span class="toc-chapter-title">'+escapeHtml(item.title||'--')+'</span><span class="toc-chapter-meta">'+formatWordCount(cwn)+' · '+(ct==='1'?'番外':'正文')+' · '+(isf?'免费':'付费')+'</span></a></div>';
          }).join('') + '</div>';
      var overlay = document.createElement('div');
      overlay.className = 'detail-modal-overlay';
      overlay.innerHTML = '<div class="detail-modal">' +
        '<button class="detail-modal-close" aria-label="关闭">&times;</button>' +
        '<div class="detail-modal-left">' +
          '<div class="detail-modal-cover-area">' + coverHtml + '</div>' +
          '<div class="book-detail-info">' +
            '<h3>'+escapeHtml(d.bookName||'--')+'</h3>' +
            '<div class="author">'+escapeHtml(d.author||'--')+'</div>' +
            '<div class="desc">'+escapeHtml((d.description||'').slice(0,500))+'</div>' +
            '<div class="book-detail-stats">' +
              '<div class="stat"><span class="stat-label">状态</span><span class="stat-value">'+bookStatusText(d.status)+'</span></div>' +
              '<div class="stat"><span class="stat-label">字数</span><span class="stat-value">'+formatWordCount(d.wordNumber)+'</span></div>' +
              '<div class="stat"><span class="stat-label">章节</span><span class="stat-value">'+(d.totalChapters!=null?d.totalChapters:'--')+'</span></div>' +
              '<div class="stat"><span class="stat-label">评分</span><span class="stat-value">'+(d.score!=null?d.score:'--')+'</span></div>' +
              '<div class="stat"><span class="stat-label">分类</span><span class="stat-value">'+escapeHtml(d.category||'--')+'</span></div>' +
              '<div class="stat"><span class="stat-label">阅读</span><span class="stat-value">'+escapeHtml(d.readCount||'--')+'</span></div>' +
              vipHtml +
            '</div>' +
            '<div class="flex gap-8" style="flex-wrap:wrap;">' +
              '<button class="btn btn-sm bs-read-book" data-book-id="'+escapeHtml(bookId)+'" data-first-chapter="'+escapeHtml(fch)+'"><svg class="ic"><use href="/css/icons.svg#icon-book"/></svg> 开始阅读</button>' +
              '<button class="btn btn-sm btn-accent bs-download-book" data-book-id="'+escapeHtml(bookId)+'"><svg class="ic"><use href="/css/icons.svg#icon-download"/></svg> 全本下载</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="detail-modal-divider"></div>' +
        '<div class="detail-modal-right">' +
          '<div class="detail-modal-right-header"><svg class="ic"><use href="/css/icons.svg#icon-clipboard"/></svg> 章节目录 <span class="text-muted" style="font-weight:400;font-size:0.75rem;text-transform:none;">('+dirItems.length+' 章)</span></div>' +
          tocHtml +
        '</div>' +
      '</div>';
      document.body.appendChild(overlay);
      // A 桶 ESC 泄漏修复:三个关闭路径(关闭按钮/遮罩点击/Esc)统一走 closeOverlay,
      // 先解绑 keydown 再移除弹层,避免 escHandler 泄漏
      function closeOverlay() {
        document.removeEventListener('keydown', escHandler);
        if (overlay.parentNode) overlay.remove();
      }
      function escHandler(e) { if (e.key === 'Escape') closeOverlay(); }
      overlay.querySelector('.detail-modal-close').addEventListener('click', closeOverlay);
      overlay.addEventListener('click', function(e){ if (e.target === overlay) closeOverlay(); });
      var readBtn = overlay.querySelector('.bs-read-book');
      if (readBtn) readBtn.addEventListener('click', function(){
        var bid2 = this.dataset.bookId, cid = this.dataset.firstChapter;
        if (bid2 && cid) { window.open('/reader.html?bookId='+encodeURIComponent(bid2)+'&chapterId='+encodeURIComponent(cid)); }
        else showToast('缺少章节信息', 'error');
      });
      var dlBtn = overlay.querySelector('.bs-download-book');
      if (dlBtn) dlBtn.addEventListener('click', async function(){
        var bid2 = this.dataset.bookId;
        if (!bid2) return;
        this.disabled = true;
        this.textContent = '⏳ 下载中...';
        try {
          var resp = await apiPostDirect('/api/fullbook/download', { bookId: bid2, batchSize: 30, maxChapters: 0, saveToRedis: true, streamResponse: true });
          if (resp && resp.success) { showToast('已发起下载，可在「全本下载」页查看进度', 'success'); }
          else { showToast((resp&&resp.message)||'下载请求失败', 'error'); }
        } catch(e) { showToast('下载请求失败: ' + e.message, 'error'); }
        finally { this.disabled = false; this.innerHTML = '<svg class="ic"><use href="/css/icons.svg#icon-download"/></svg> 全本下载'; }
      });
      document.addEventListener('keydown', escHandler);
    } catch(e) { showToast('请求失败: ' + e.message, 'error'); }
    finally { hideLoading(); }
  }

  document.addEventListener('DOMContentLoaded', function() {
    $('btn-bs-search').addEventListener('click', function(){ searchBooks(0); });
    $('bs-query').addEventListener('keydown', function(e){ if (e.key === 'Enter') searchBooks(0); });

    // T9 表单直觉化:清空按钮恢复初始态
    var clearBtn = $('btn-bs-clear');
    if (clearBtn) clearBtn.addEventListener('click', function(){
      $('bs-query').value = '';
      var body = $('bs-result-body');
      if (body) body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:30px;">✦ 输入关键词开始搜索</td></tr>';
      var count = $('bs-result-count');
      if (count) count.textContent = '';
      var pg = $('bs-pagination');
      if (pg) pg.innerHTML = '';
      $('bs-query').focus();
    });

    // T9 快捷键:Ctrl+K 聚焦搜索框
    registerShortcut('ctrl+k', function(e){ e.preventDefault(); var q = $('bs-query'); if (q) { q.focus(); q.select(); } });

    // F2 死按钮修复:移动端 ☰ 绑定侧栏抽屉(与其他公开页一致)
    var menuBtn = $('mobile-menu-toggle');
    var sidebar = document.querySelector('.public-sidebar');
    if (menuBtn && sidebar) {
      menuBtn.addEventListener('click', function() { sidebar.classList.toggle('open'); });
      document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768 && sidebar.classList.contains('open') &&
            !sidebar.contains(e.target) && e.target !== menuBtn) {
          sidebar.classList.remove('open');
        }
      });
    }
  });
})();
</script>
</body>
</html>
