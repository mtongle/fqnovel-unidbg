server:
  port: 8099
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml
application:
  unidbg:
    dynarmic: false
    verbose: false
    async: true
  http-client:
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
    max-connections: 50
    max-connections-per-route: 20
fq:
  api:
    base-url: https://api5-normal-sinfonlineb.fqnovel.com
    cookie: store-region=cn-zj; store-region-src=did; install_id=2420480337007787;
    device-pool:
      enabled: true
      size: 5
spring:
  application:
    name: unidbg-boot-server
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
  task:
    execution:
      pool:
        allow-core-thread-timeout: true
        core-size: 8
        keep-alive: 60s
        max-size: 8
  sleuth:
    sampler:
      probability: 0.1
    async:
      enabled: true
      configurer:
        enabled: true
  redis:
    host: 127.0.0.1
    port: 26586
    # 密码通过环境变量注入：spring.redis.password=${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
logging:
  level:
    root: info